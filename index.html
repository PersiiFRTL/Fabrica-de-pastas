<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fabrica de Pastas — Sistema de Gestión</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --cream: #F5F0E8;
      --cream-dark: #EDE6D6;
      --wheat: #C8A96E;
      --wheat-light: #E8D5A8;
      --wheat-dark: #9B7A3E;
      --brown: #5C3D1E;
      --brown-light: #7A5230;
      --red: #C0392B;
      --green: #27AE60;
      --blue: #3498DB;
      --text: #2C1810;
      --text-muted: #7A6050;
      --white: #FFFFFF;
      --shadow: 0 4px 24px rgba(92, 61, 30, 0.12);
      --shadow-lg: 0 8px 40px rgba(92, 61, 30, 0.18);
      --radius: 12px;
      --radius-sm: 8px;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100%;
      display: flex;
    }

    .sidebar {
      width: 264px;
      min-height: 100vh;
      background: var(--brown);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      overflow-y: auto;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .sidebar-logo {
      padding: 26px 24px 18px;
      border-bottom: 1px solid rgba(200, 169, 110, 0.2);
    }

    .sidebar-logo h1 {
      font-family: 'Playfair Display', serif;
      color: var(--wheat);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.2;
    }

    .sidebar-logo span {
      color: rgba(200, 169, 110, 0.6);
      font-size: 10.5px;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: block;
      margin-top: 4px;
    }

    .sidebar-section {
      padding: 16px 14px 4px;
    }

    .sidebar-section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--wheat);
      opacity: .75;
      padding: 0 10px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: rgba(245, 240, 232, 0.72);
      font-size: 13.5px;
      font-weight: 400;
      transition: all .16s;
      margin-bottom: 2px;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background: rgba(200, 169, 110, 0.12);
      color: var(--cream);
    }

    .nav-item.active {
      background: var(--wheat);
      color: var(--brown);
      font-weight: 600;
    }

    .nav-item .icon {
      font-size: 15px;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    .main {
      margin-left: 264px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      background: var(--white);
      border-bottom: 1px solid var(--cream-dark);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-title {
      font-family: 'Playfair Display', serif;
      font-size: 21px;
      font-weight: 600;
      color: var(--brown);
    }

    .topbar-crumb {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .role-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .role-switch[hidden] {
      display: none;
    }

    .role-switch strong {
      color: var(--brown);
      font-weight: 600;
    }

    .role-switch select {
      max-width: 230px;
      padding: 8px 30px 8px 10px;
      border: 1px solid var(--cream-dark);
      border-radius: var(--radius-sm);
      background: var(--white);
      color: var(--brown);
      font: 500 12px 'DM Sans', sans-serif;
    }

    .btn {
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all .16s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--wheat);
      color: var(--brown);
    }

    .btn-primary:hover {
      background: var(--wheat-dark);
      color: var(--white);
    }

    .btn-danger {
      background: rgba(192, 57, 43, 0.1);
      color: var(--red);
    }

    .btn-danger:hover {
      background: var(--red);
      color: var(--white);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--cream-dark);
    }

    .btn-ghost:hover {
      background: var(--cream-dark);
      color: var(--text);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 11.5px;
    }

    .content {
      padding: 26px 32px 60px;
      flex: 1;
      max-width: 1180px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 26px;
    }

    .stat-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--wheat);
    }

    .stat-card.v {
      border-color: var(--wheat);
    }

    .stat-card.p {
      border-color: var(--green);
    }

    .stat-card.c {
      border-color: var(--blue);
    }

    .stat-card.a {
      border-color: var(--red);
    }

    .stat-card .label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .stat-card .value {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--brown);
      line-height: 1;
    }

    .stat-card .sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 22px;
    }

    .card-header {
      padding: 16px 22px;
      border-bottom: 1px solid var(--cream-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 16.5px;
      font-weight: 600;
      color: var(--brown);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .class-tag {
      font-family: 'DM Mono', 'Courier New', monospace;
      font-size: 10.5px;
      color: var(--wheat-dark);
      background: rgba(200, 169, 110, 0.15);
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      margin-top: 4px;
      letter-spacing: .2px;
    }

    .search-input {
      padding: 8px 14px;
      border: 1px solid var(--cream-dark);
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--cream);
      outline: none;
      width: 200px;
    }

    .search-input:focus {
      border-color: var(--wheat);
      background: var(--white);
    }

    .card-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: var(--cream);
      padding: 10px 16px;
      text-align: left;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--cream-dark);
    }

    tbody tr {
      border-bottom: 1px solid var(--cream-dark);
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--cream);
    }

    tbody td {
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text);
      vertical-align: middle;
    }

    .td-actions {
      display: flex;
      gap: 6px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 600;
    }

    .badge-green {
      background: rgba(39, 174, 96, 0.12);
      color: #1a8a47;
    }

    .badge-red {
      background: rgba(192, 57, 43, 0.12);
      color: #a02820;
    }

    .badge-amber {
      background: rgba(200, 169, 110, 0.2);
      color: var(--wheat-dark);
    }

    .badge-blue {
      background: rgba(52, 152, 219, 0.12);
      color: #1a6fa0;
    }

    .badge-gray {
      background: rgba(120, 100, 80, 0.12);
      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(44, 24, 16, 0.5);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--white);
      border-radius: var(--radius);
      width: 520px;
      max-width: 95vw;
      box-shadow: var(--shadow-lg);
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 20px 24px 14px;
      border-bottom: 1px solid var(--cream-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--brown);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 19px;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .modal-close:hover {
      background: var(--cream-dark);
    }

    .modal-body {
      padding: 20px 24px;
    }

    .modal-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--cream-dark);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group.span2 {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: .4px;
    }

    .form-input,
    .form-select,
    .form-textarea {
      padding: 9px 12px;
      border: 1.5px solid var(--cream-dark);
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--cream);
      outline: none;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--wheat);
      background: var(--white);
    }

    .form-textarea {
      resize: vertical;
      min-height: 64px;
    }

    .detail-block {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed var(--cream-dark);
    }

    .detail-rows {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--cream-dark);
      border-radius: var(--radius-sm);
      background: var(--cream);
    }

    .detail-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .detail-field label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .detail-row .form-select,
    .detail-row .form-input {
      width: 100%;
      min-width: 0;
    }

    .detail-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--brown);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .detail-block table {
      margin-bottom: 8px;
    }

    .detail-block thead th {
      background: transparent;
      padding: 4px 6px;
      font-size: 10px;
    }

    .detail-block tbody td {
      padding: 5px 6px;
    }

    .detail-block .form-select,
    .detail-block .form-input {
      padding: 7px 9px;
      font-size: 12.5px;
    }

    .rm-detail-btn {
      background: none;
      border: none;
      color: var(--red);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 3px 6px;
    }

    .rm-detail-btn:hover {
      color: #8f231b;
    }

    .add-detail-btn {
      background: none;
      border: 1px dashed var(--wheat);
      color: var(--wheat-dark);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
    }

    .add-detail-btn:hover {
      background: rgba(200, 169, 110, 0.12);
    }

    .view-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .view-field {
      background: var(--cream);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }

    .view-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .view-value {
      font-size: 13.5px;
      color: var(--text);
      font-weight: 500;
    }

    .dash-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 20px;
      margin-top: 24px;
    }

    .dash-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 22px;
    }

    .dash-card-title {
      font-family: 'Playfair Display', serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--brown);
      margin-bottom: 14px;
    }

    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--cream-dark);
    }

    .activity-item:last-child {
      border-bottom: none;
    }

    .activity-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .activity-text {
      font-size: 13px;
      color: var(--text);
      line-height: 1.4;
    }

    .activity-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .confirm-icon {
      font-size: 38px;
      text-align: center;
      margin-bottom: 10px;
    }

    .confirm-msg {
      text-align: center;
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .confirm-msg strong {
      color: var(--text);
    }

    .welcome-banner {
      background: linear-gradient(135deg, var(--brown) 0%, var(--brown-light) 100%);
      border-radius: var(--radius);
      padding: 26px 30px;
      color: var(--cream);
      margin-bottom: 26px;
      position: relative;
      overflow: hidden;
    }

    .welcome-banner::after {
      content: '🍝';
      position: absolute;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 58px;
      opacity: .15;
    }

    .welcome-banner h2 {
      font-family: 'Playfair Display', serif;
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .welcome-banner p {
      font-size: 13.5px;
      opacity: .72;
    }

    .notify {
      position: fixed;
      bottom: calc(26px + env(safe-area-inset-bottom, 0px));
      right: 26px;
      background: var(--brown);
      color: var(--cream);
      padding: 13px 20px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 999;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .notify.show {
      display: flex;
    }

    @media (max-width:900px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        position: static;
        width: 100%;
        min-height: auto;
        flex-direction: row;
        overflow-x: auto;
        padding: 10px;
      }

      .sidebar-logo,
      .sidebar-section-title {
        display: none;
      }

      .sidebar-section {
        padding: 0 4px;
        display: flex;
        gap: 4px;
      }

      .nav-item {
        white-space: nowrap;
        width: auto;
      }

      .main {
        margin-left: 0;
      }

      .topbar {
        padding: 14px 16px;
        gap: 12px;
      }

      .topbar-controls {
        gap: 8px;
        flex-direction: column-reverse;
        align-items: flex-end;
      }

      .role-switch span {
        display: none;
      }

      .role-switch select {
        max-width: 180px;
        font-size: 11px;
      }

      .stats-row {
        grid-template-columns: 1fr 1fr;
      }

      .dash-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .content {
        padding: 18px 16px 50px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-crumb" id="topbar-crumb">Principal</div>
      </div>
      <div class="topbar-controls">
        <label class="role-switch"><span>Vista de perfil</span>
          <select id="role-select" aria-label="Seleccionar perfil" onchange="setRole(this.value)"></select>
        </label>
        <label class="role-switch" id="customer-account" hidden><span>Cuenta</span><strong id="customer-name"></strong></label>
        <span style="font-size:12.5px;color:var(--text-muted)">Hoy: <strong id="today-date"></strong></span>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>

  <div class="modal-overlay" id="modal-view">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="mv-title">Detalle</div>
          <div class="class-tag" id="mv-class"></div>
        </div>
        <button class="modal-close" onclick="closeModal('modal-view')">×</button>
      </div>
      <div class="modal-body">
        <div id="mv-body"></div>
      </div>
      <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('modal-view')">Cerrar</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-form">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="mf-title">Nuevo registro</div><button class="modal-close"
          onclick="closeModal('modal-form')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid" id="mf-fields"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('modal-form')">Cancelar</button>
        <button class="btn btn-primary" id="mf-save">Guardar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-delete">
    <div class="modal" style="width:380px">
      <div class="modal-header">
        <div class="modal-title">Confirmar eliminación</div><button class="modal-close"
          onclick="closeModal('modal-delete')">×</button>
      </div>
      <div class="modal-body">
        <div class="confirm-icon">🗑️</div>
        <div class="confirm-msg">¿Estás seguro que querés eliminar <strong id="md-name">este registro</strong>?<br>Esta
          acción no se puede deshacer.</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('modal-delete')">Cancelar</button>
        <button class="btn btn-danger" id="md-confirm">Sí, eliminar</button>
      </div>
    </div>

          { l: "fechaOrden", t: "date" }, { l: "fechaEsperada", t: "date" },
          { l: "estado", t: "select", o: ["Pendiente", "Recibida", "Cancelada"] },
        ],
        details: [{ key: "detOC", cls: "Detalle_CompraProv", ref: "materias", refLabel: "Materia prima", extra: [{ l: "Cantidad", t: "number" }, { l: "PrecioUnitario", t: "text" }] }]
      },
      {
        id: "remitosProv", section: "compras", icon: "🚛", label: "Remitos de Proveedor", singular: "remito de proveedor", cls: "Remito Provedor ⊳ Comprobante Provedor",
        cols: ["IdRemitoProv", "idOrdenCompraProv", "Proveedor", "fecha", "estado"],
        rows: [["#RP-091", "#OC-0211", "Avícola del Sur", "19/09/2026", "<span class='badge badge-green'>Recibido</span>"]],
        fields: [
          { l: "IdOrdenCompraProv", t: "select", ref: "ordenesCompra" },
          { l: "id_provedor", t: "select", ref: "proveedores" }, { l: "fecha", t: "date" },
          { l: "estado", t: "select", o: ["Pendiente", "Recibido"] },
        ],
        details: [{ key: "detRP", cls: "Detalle Remito Provedor", ref: "materias", refLabel: "Materia prima", extra: [{ l: "Cantidad", t: "number" }, { l: "PrecioUnitario", t: "text" }] }]
      },
      {
        id: "comprobantesProv", section: "compras", icon: "🧾", label: "Comprobantes de Venta de Proveedor", singular: "comprobante de venta de proveedor", cls: "Comprobante de Venta Provedor ⊳ Comprobante Provedor",
        cols: ["idCompVentaProv", "Proveedor", "fecha", "tipo", "total", "Estado"],
        rows: [["#CVP-155", "Avícola del Sur", "19/09/2026", "Cuenta corriente", "$68.200", "<span class='badge badge-green'>Confirmado</span>"]],
        fields: [
          { l: "id_provedor", t: "select", ref: "proveedores" }, { l: "fecha", t: "date" },
          { l: "tipo", t: "select", o: ["Contado", "Cuenta corriente"] },
          { l: "Estado (heredado de Comprobante Provedor)", t: "select", o: ["Confirmado", "Anulado"] },
        ],
        details: [{ key: "detCVP", cls: "Detalle ComprobanteVentaProvedor", ref: "materias", refLabel: "Materia prima", extra: [{ l: "Cantidad", t: "number" }, { l: "PrecioUnitario", t: "text" }] }]
      },
      {
        id: "ordenesPago", section: "compras", icon: "💵", label: "Órdenes de Pago", singular: "orden de pago", cls: "OrdenPago",
        cols: ["N°", "idOrdenCompraProv (Detalle_OrdenPago)", "idFormaPago", "montoPagado", "estado"],
        rows: [["#PGP-070", "#OC-0211", "Transferencia", "$68.200", "<span class='badge badge-green'>Pagada</span>"]],
        fields: [
          { l: "idFormaPago", t: "select", o: ["Efectivo", "Transferencia", "Cheque"] },
          { l: "fecha", t: "date" }, { l: "estado", t: "select", o: ["Pendiente", "Pagada"] },
        ],
        details: [{ key: "detOPpago", cls: "Detalle_OrdenPago", ref: "ordenesCompra", refLabel: "Orden de compra cancelada", extra: [{ l: "MontoPagado", t: "text" }] }]
      },
    ];

    function initializeCustomerOwnership() {
      const clients = E.find(entity => entity.id === "clientes");
      ["presupuestos", "pedidos"].forEach(id => {
        const entity = E.find(item => item.id === id);
        entity.rows.forEach(row => {
          const client = clients.rows.find(item => normalizeLabel(item[0]) === normalizeLabel(row[1] || ""));
          if (client) row.customerDocument = client[1];
        });
      });
    }

    /* ============ RENDER SIDEBAR ============ */
    function renderSidebar() {
      const el = document.getElementById("sidebar");
      const role = ROLES.find(item => item.id === currentRole);
      let h = `<div class="sidebar-logo"><h1>Fabrica de Pastas</h1><span>Sistema de Gestión</span></div>
  <div class="sidebar-section">
    <div class="sidebar-section-title">Principal</div>
    <button class="nav-item active" data-screen="dashboard" onclick="showScreen('dashboard',this,'${role.label}')"><span class="icon">🏠</span> Dashboard</button>
  </div>`;
      SECTIONS.forEach(s => {
        const sectionEntities = E.filter(e => e.section === s.id && roleCanAccess(e.id));
        if (!sectionEntities.length) return;
        h += `<div class="sidebar-section"><div class="sidebar-section-title">${s.icon} ${s.label}</div>`;
        sectionEntities.forEach(e => {
          h += `<button class="nav-item" data-screen="${e.id}" onclick="showScreen('${e.id}',this,'${s.label}')"><span class="icon">${e.icon}</span> ${e.label}</button>`;
        });
        h += `</div>`;
      });
      el.innerHTML = h;
    }

    function renderRoleSelector() {
      const select = document.getElementById("role-select");
      select.innerHTML = ROLES.map(role => `<option value="${role.id}">${role.label}</option>`).join("");
      select.value = currentRole;
    }

    /* ============ RENDER SCREENS ============ */
    function entityScreen(e) {
      const rows = visibleRows(e);
      return `<div id="screen-${e.id}" class="screen">
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${e.icon} ${e.label}</div>
          <div class="class-tag">clase: ${e.cls}</div>
        </div>
        <div class="card-actions">
          <input class="search-input" placeholder="Buscar...">
          <button class="btn btn-primary" onclick="openForm('${e.id}')">+ Nuevo</button>
        </div>
      </div>
      <table>
        <thead><tr>${e.cols.map(c => `<th>${c}</th>`).join("")}<th></th></tr></thead>
        <tbody>${rows.length ? rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}<td class="td-actions">
          <button class="btn btn-ghost btn-sm" onclick="openView('${e.id}',${e.rows.indexOf(r)})">Ver</button>
          <button class="btn btn-ghost btn-sm" onclick="openForm('${e.id}',${e.rows.indexOf(r)})">Editar</button>
          <button class="btn btn-danger btn-sm" onclick="openDelete('${r[0].replace(/<[^>]+>/g, "")}')">Eliminar</button>
        </td></tr>`).join("") : `<tr><td colspan="${e.cols.length + 1}" style="text-align:center;color:var(--text-muted);padding:24px">Todavía no hay registros. Seleccioná “+ Nuevo” para crear uno.</td></tr>`}</tbody>
      </table>
    </div>
  </div>`;
    }

    function dashboardScreen() {
      const role = ROLES.find(item => item.id === currentRole);
      const dashboard = DASHBOARDS[currentRole];
      if (dashboard) {
        let stats = dashboard.stats;
        if (currentRole === "cliente") {
          const budgets = visibleRows(E.find(entity => entity.id === "presupuestos"));
          const orders = visibleRows(E.find(entity => entity.id === "pedidos"));
          stats = [["Mis presupuestos", budgets.length, "Historial de esta cuenta", "v"], ["Mis pedidos", orders.length, "Historial de esta cuenta", "p"], ["Cuenta", currentCustomer ? "Activa" : "Sin cuenta", currentCustomer || "Registrá tus datos", "c"]];
        }
        const cards = stats.map(([label, value, sub, color]) => `<div class="stat-card ${color}"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`).join("");
        const links = dashboard.links.map(id => E.find(entity => entity.id === id)).filter(Boolean);
        return `<div id="screen-dashboard" class="screen active">
          <div class="welcome-banner"><h2>${dashboard.heading}</h2><p>${dashboard.description}</p></div>
          <div class="stats-row">${cards}</div>
          <div class="dash-grid"><div class="dash-card"><div class="dash-card-title">Accesos de ${role.label.toLowerCase()}</div>
            ${links.map(entity => `<div class="activity-item"><div class="activity-dot" style="background:var(--wheat)"></div><button class="nav-item" style="color:var(--text);padding:4px 0;width:auto" onclick="showScreen('${entity.id}',document.querySelector('[data-screen=\"${entity.id}\"]'),'${SECTIONS.find(section => section.id === entity.section)?.label || role.label}')"><span class="icon">${entity.icon}</span>${entity.label}</button></div>`).join("")}
          </div><div class="dash-card"><div class="dash-card-title">Perfil activo</div><div class="activity-item"><div><div class="activity-text"><strong>${role.label}</strong></div><div class="activity-time">La navegación muestra las herramientas asignadas a este perfil.</div></div></div></div></div>
        </div>`;
      }
      return `<div id="screen-dashboard" class="screen active">
    <div class="welcome-banner"><h2>¡Bienvenido de nuevo!</h2><p>Resumen de la fábrica — 23 de septiembre de 2026</p></div>
    <div class="stats-row">
      <div class="stat-card v"><div class="label">Ventas hoy</div><div class="value">$43.800</div><div class="sub">8 pedidos despachados</div></div>
      <div class="stat-card p"><div class="label">Producción del día</div><div class="value">215 kg</div><div class="sub">2 órdenes en curso</div></div>
      <div class="stat-card c"><div class="label">Compras pendientes</div><div class="value">2</div><div class="sub">$480.200 comprometidos</div></div>
      <div class="stat-card a"><div class="label">Stock bajo</div><div class="value">3</div><div class="sub">materias primas por reponer</div></div>
    </div>
    <div class="dash-grid">
      <div class="dash-card">
        <div class="dash-card-title">Actividad reciente</div>
        <div class="activity-item"><div class="activity-dot" style="background:var(--wheat)"></div><div><div class="activity-text">Se aprobó el presupuesto <strong>#PR-0207</strong> de Hotel Belgrano.</div><div class="activity-time">Hace 40 min</div></div></div>
        <div class="activity-item"><div class="activity-dot" style="background:var(--green)"></div><div><div class="activity-text">Orden de producción <strong>#OPR-329</strong> finalizada (95 kg).</div><div class="activity-time">Hace 2 h</div></div></div>
        <div class="activity-item"><div class="activity-dot" style="background:var(--blue)"></div><div><div class="activity-text">Nueva orden de compra <strong>#OC-0219</strong> a Molino San Martín.</div><div class="activity-time">Hace 5 h</div></div></div>
        <div class="activity-item"><div class="activity-dot" style="background:var(--red)"></div><div><div class="activity-text">Máquina <strong>Envasadora</strong> marcada fuera de servicio.</div><div class="activity-time">Ayer</div></div></div>
      </div>
      <div class="dash-card">
        <div class="dash-card-title">Alertas de stock mínimo</div>
        <div class="activity-item"><div class="activity-dot" style="background:var(--red)"></div><div><div class="activity-text">Levadura: 12 kg (mínimo 5 kg) — reponer pronto</div></div></div>
        <div class="activity-item"><div class="activity-dot" style="background:var(--wheat)"></div><div><div class="activity-text">Sorrentinos J&Q: 18 kg en stock reserva</div></div></div>
        <div class="activity-item"><div class="activity-dot" style="background:var(--wheat)"></div><div><div class="activity-text">Próxima entrega fija: Restó La Nonna, lunes</div></div></div>
      </div>
    </div>
  </div>`;
    }

    function renderContent() {
      document.getElementById("content").innerHTML = dashboardScreen() + E.filter(e => roleCanAccess(e.id)).map(entityScreen).join("");
    }

    function renderCustomerIndicator() {
      const indicator = document.getElementById("customer-account");
      indicator.hidden = currentRole !== "cliente";
      document.getElementById("customer-name").textContent = currentCustomer || "Sin cuenta";
    }

    function setRole(roleId) {
      if (!ROLES.some(role => role.id === roleId)) return;
      currentRole = roleId;
      localStorage.setItem("pastas-role", roleId);
      renderSidebar();
      renderContent();
      renderCustomerIndicator();
      document.getElementById("topbar-title").textContent = "Dashboard";
      document.getElementById("topbar-crumb").textContent = ROLES.find(role => role.id === roleId).label;
    }

    function visibleRows(entity) {
      if (!entity) return [];
      if (currentRole !== "cliente" || !["presupuestos", "pedidos"].includes(entity.id)) return entity.rows;
      return entity.rows.filter(row => row.customerDocument === currentCustomerDocument);
    }

    /* ============ NAV / MODALES ============ */
    function showScreen(id, btn, crumb) {
      if (id !== "dashboard" && !roleCanAccess(id)) return;
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
      const screen = document.getElementById("screen-" + id);
      if (!screen) return;
      screen.classList.add("active");
      const e = E.find(x => x.id === id);
      document.getElementById("topbar-title").textContent = e ? e.label : "Dashboard";
      document.getElementById("topbar-crumb").textContent = crumb;
      if (btn) btn.classList.add("active");
    }

    function refOptions(id) {
      const e = E.find(x => x.id === id);
      if (currentRole === "cliente" && id === "clientes") return currentCustomer ? [currentCustomer] : [];
      if (currentRole === "cliente" && id === "presupuestos") return visibleRows(e).map(row => row[0].replace(/<[^>]+>/g, ""));
      return e ? e.rows.map(r => r[0].replace(/<[^>]+>/g, "")) : [];
    }

    function fieldHtml(f) {
      const span = f.span === 2 ? " span2" : "";
      let input;
      if (f.ref) input = `<select class="form-select">${refOptions(f.ref).map(o => `<option>${o}</option>`).join("")}</select>`;
      else if (f.t === "select") input = `<select class="form-select">${f.o.map(o => `<option>${o}</option>`).join("")}</select>`;
      else if (f.t === "textarea") input = `<textarea class="form-textarea"></textarea>`;
      else input = `<input class="form-input" type="${f.t}">`;
      return `<div class="form-group${span}"><label class="form-label">${f.l}</label>${input}</div>`;
    }

    /* ---- Líneas de detalle (Detalle_X): 1 a muchos, sin límite de filas ---- */
    let currentFormEntity = null;
    let formState = {};

    function detailRowHtml(g, rowIdx) {
      return `<div class="detail-row">
    <div class="detail-field"><label>${g.refLabel}</label><select class="form-select">${refOptions(g.ref).map(o => `<option>${o}</option>`).join("")}</select></div>
    ${g.extra.map(x => `<div class="detail-field"><label>${x.l}</label>${x.t === "number"
        ? `<input class="form-input" type="number" min="1" value="1">`
        : `<input class="form-input" type="text">`}</div>`).join("")}
    <button type="button" class="rm-detail-btn" onclick="removeDetailRow('${g.key}',${rowIdx})" title="Quitar">✕</button>
  </div>`;
    }

    function detailGroupHtml(g) {
      const rows = formState[g.key] || [];
      return `<div class="detail-block" data-group="${g.key}">
    <div class="detail-label">${g.refLabel}s <span class="class-tag">clase: ${g.cls}</span></div>
    <div class="detail-rows">${rows.map((_, i) => detailRowHtml(g, i)).join("")}</div>
    <button type="button" class="add-detail-btn" onclick="addDetailRow('${g.key}')">+ Agregar ${g.refLabel.toLowerCase()}</button>
  </div>`;
    }

    function rerenderGroup(key) {
      const e = E.find(x => x.id === currentFormEntity);
      const g = e.details.find(d => d.key === key);
      const block = document.querySelector(`.detail-block[data-group="${key}"]`);
      if (block) block.outerHTML = detailGroupHtml(g);
    }

    function addDetailRow(key) {
      formState[key].push(Date.now() + Math.random());
      rerenderGroup(key);
    }
    function removeDetailRow(key, idx) {
      if (formState[key].length <= 1) { showNotify("Debe quedar al menos un ítem cargado."); return; }
      formState[key].splice(idx, 1);
      rerenderGroup(key);
    }

    function openView(entityId, rowIdx) {
      const e = E.find(x => x.id === entityId);
      const row = e.rows[rowIdx];
      document.getElementById("mv-title").textContent = `${e.icon} ${row[0].replace(/<[^>]+>/g, "")}`;
      document.getElementById("mv-class").textContent = "clase: " + e.cls;
      let h = `<div class="view-grid">`;
      e.cols.forEach((c, i) => {
        h += `<div class="view-field"><div class="view-label">${c}</div><div class="view-value">${row[i] ?? "—"}</div></div>`;
      });
      h += `</div>`;
      if (e.details && e.details.length) {
        e.details.forEach(g => {
          const opts = refOptions(g.ref);
          const sample = opts.slice(0, Math.min(2, opts.length));
          h += `<div class="detail-block">
        <div class="detail-label">${g.refLabel}s <span class="class-tag">clase: ${g.cls}</span></div>
        <table><thead><tr><th>${g.refLabel}</th>${g.extra.map(x => `<th>${x.l}</th>`).join("")}</tr></thead>
        <tbody>${sample.map(o => `<tr><td>${o}</td>${g.extra.map(() => `<td>—</td>`).join("")}</tr>`).join("")}</tbody></table>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">Vista de ejemplo — el detalle real se completa al cargar el comprobante.</div>
      </div>`;
        });
      }
      document.getElementById("mv-body").innerHTML = h;
      openModal("modal-view");
    }

    function openForm(entityId, rowIndex = null) {
      const e = E.find(x => x.id === entityId);
      currentFormEntity = entityId;
      formState = {};
      (e.details || []).forEach(g => { formState[g.key] = [1]; }); // arranca con 1 fila, se pueden agregar todas las que hagan falta
      const editing = rowIndex !== null && e.rows[rowIndex];
      document.getElementById("mf-title").innerHTML = `${editing ? "Editar " : "Nuevo "}${e.singular} <span class="class-tag" style="margin-left:6px">clase: ${e.cls}</span>`;
      let body = `<div class="form-grid">${e.fields.map(fieldHtml).join("")}</div>`;
      (e.details || []).forEach(g => { body += detailGroupHtml(g); });
      document.getElementById("mf-fields").innerHTML = body;
      if (editing) {
        document.querySelectorAll("#mf-fields .form-grid .form-group").forEach(group => {
          const label = group.querySelector(".form-label").textContent;
          const colIndex = e.cols.findIndex(col => normalizeLabel(col) === normalizeLabel(label));
          if (colIndex < 0) return;
          const cell = document.createElement("div");
          cell.innerHTML = e.rows[rowIndex][colIndex] || "";
          group.querySelector("input, select, textarea").value = cell.textContent.trim();
        });
      }
      document.getElementById("mf-save").onclick = () => {
        const requiredFields = document.querySelectorAll("#mf-fields [required]");
        for (const field of requiredFields) {
          if (!field.reportValidity()) return;
        }
        const n = (e.details || []).reduce((s, g) => s + formState[g.key].length, 0);
        const updatedRow = editing ? [...e.rows[rowIndex]] : Array(e.cols.length).fill("—");
        document.querySelectorAll("#mf-fields .form-grid .form-group").forEach((group, index) => {
          const label = group.querySelector(".form-label").textContent;
          let colIndex = e.cols.findIndex(col => normalizeLabel(col) === normalizeLabel(label));
          if (colIndex < 0 && !editing && index < updatedRow.length) colIndex = index;
          if (colIndex < 0) return;
          const control = group.querySelector("input, select, textarea");
          updatedRow[colIndex] = escapeHTML(control.value.trim() || "—");
        });
        if (currentRole === "cliente" && ["presupuestos", "pedidos"].includes(entityId)) {
          if (!editing) {
            const prefix = entityId === "presupuestos" ? "PR" : "OP";
            const baseNumber = entityId === "presupuestos" ? 208 : 891;
            updatedRow[0] = `#${prefix}-${String(baseNumber + e.rows.length).padStart(4, "0")}`;
            updatedRow[1] = escapeHTML(currentCustomer);
          }
          updatedRow.customerDocument = currentCustomerDocument;
        }
        if (!editing && entityId === "cuentaCliente") {
          const clients = E.find(entity => entity.id === "clientes");
          const duplicateDocument = clients.rows.some(row => normalizeLabel(row[1]) === normalizeLabel(updatedRow[1]));
          if (duplicateDocument) {
            showNotify("Ya existe una cuenta con ese documento.");
            return;
          }
          clients.rows.push([updatedRow[0], updatedRow[1], updatedRow[4], "No", "<span class='badge badge-green'>Activo</span>"]);
          currentCustomer = updatedRow[0];
          currentCustomerDocument = updatedRow[1];
        }
        if (editing) e.rows[rowIndex] = updatedRow;
        else e.rows.push(updatedRow);
        renderContent();
        closeModal("modal-form");
        showNotify(editing ? "Registro actualizado." : "Registro agregado.");
      };
      openModal("modal-form");
    }

    function normalizeLabel(value) {
      return value.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function escapeHTML(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function openModal(id) {
      document.getElementById(id).classList.add("open");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    function showNotify(message) {
      const notify = document.getElementById("notify");
      notify.textContent = message;
      notify.classList.add("show");
      clearTimeout(showNotify.timeout);
      showNotify.timeout = setTimeout(() => notify.classList.remove("show"), 2600);
    }

    function openDelete(name) {
      const match = E.map(entity => ({
        entity,
        rowIndex: entity.rows.findIndex(row => row[0].replace(/<[^>]+>/g, "") === name)
      })).find(item => item.rowIndex >= 0);
      if (!match) return;
      document.getElementById("md-name").textContent = name;
      document.getElementById("md-confirm").onclick = () => {
        match.entity.rows.splice(match.rowIndex, 1);
        renderContent();
        closeModal("modal-delete");
        showNotify("Registro eliminado.");
      };
      openModal("modal-delete");
    }

    function init() {
      const savedRole = localStorage.getItem("pastas-role");
      if (ROLES.some(role => role.id === savedRole)) currentRole = savedRole;
      initializeCustomerOwnership();
      renderRoleSelector();
      renderSidebar();
      renderContent();
      document.getElementById("today-date").textContent = new Date().toLocaleDateString("es-AR");
      document.getElementById("topbar-crumb").textContent = ROLES.find(role => role.id === currentRole).label;
      document.querySelectorAll(".modal-overlay").forEach(overlay => {
        overlay.addEventListener("click", event => {
          if (event.target === overlay) closeModal(overlay.id);
        });
      });
    }

    init();
  </script>
</body>
</html>
